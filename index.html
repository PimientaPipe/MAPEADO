<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: mapa a pantalla completa; barra flotante arriba, controles del mapa a la derecha,
   herramientas abajo al alcance del pulgar. Colores de señalización vial: azul "E", rojo prohibido. */
:root{
  --sign:#0a57d6;
  --danger:#c4170f;
  --ink:#121722;
  --ink-2:#4b5568;
  --ink-3:#7a8497;
  --panel:#ffffff;
  --panel-2:#eef2f8;
  --line:#d6dce7;
  --map-bg:#d8dee6;
  --scrim:rgba(8,14,26,.45);
  --shadow:0 4px 18px rgba(8,18,40,.22);
  --warn-bg:#fff3e0;
  --warn-ink:#8a4300;
  --toast-act:#ffd24d;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sign:#3b82ff; --danger:#ff6b63; --ink:#edf1f7; --ink-2:#aab4c6; --ink-3:#7f8aa0;
    --panel:#161b25; --panel-2:#222a38; --line:#2f394b; --map-bg:#1a1f28;
    --scrim:rgba(0,0,0,.55); --shadow:0 4px 18px rgba(0,0,0,.5);
    --warn-bg:#3a2a12; --warn-ink:#ffc27a; --toast-act:#0a57d6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sign:#3b82ff; --danger:#ff6b63; --ink:#edf1f7; --ink-2:#aab4c6; --ink-3:#7f8aa0;
  --panel:#161b25; --panel-2:#222a38; --line:#2f394b; --map-bg:#1a1f28;
  --scrim:rgba(0,0,0,.55); --shadow:0 4px 18px rgba(0,0,0,.5);
  --warn-bg:#3a2a12; --warn-ink:#ffc27a; --toast-act:#0a57d6; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--map-bg);color:var(--ink);font:500 15px/1.4 var(--ui);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
input{-webkit-user-select:text;user-select:text}
svg{display:block}

#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--map-bg)}

/* Barra superior */
.topbar{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;min-width:0;background:var(--panel);border-radius:12px;padding:6px 12px 6px 6px;box-shadow:var(--shadow);height:44px}
.brand-mark{flex:none;width:32px;height:32px;border-radius:7px;background:#0a57d6;color:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 2px #0a57d6,inset 0 0 0 3.5px #fff;font:700 21px/1 var(--num)}
.brand-name{display:flex;flex-direction:column;min-width:0;line-height:1.05}
.brand-name b{font:700 16px/1.05 var(--num);letter-spacing:.02em;text-transform:uppercase}
.brand-name small{font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1;min-width:0}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.flat{box-shadow:none;background:var(--panel-2);width:40px;height:40px}
.icon-btn.flat.danger{color:var(--danger)}
.pill{flex:none;height:44px;border:0;border-radius:12px;background:#0a57d6;color:#fff;box-shadow:var(--shadow);padding:0 12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill b{font:700 22px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pill small{font-size:12px;font-weight:600;opacity:.85}
@media (max-width:420px){.brand-name{display:none}.brand{padding:6px}}

/* Controles del mapa */
.map-ctrls{position:fixed;z-index:4;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;flex-direction:column;gap:8px}
.map-ctrls .icon-btn.active{background:#1a73e8;color:#fff}
.map-ctrls .icon-btn.busy svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* Indicación de herramienta */
.hint{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 64px);left:max(10px,env(safe-area-inset-left,0px));right:calc(max(10px,env(safe-area-inset-right,0px)) + 54px);max-width:520px;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--panel);border-radius:12px;padding:7px 7px 7px 12px;box-shadow:var(--shadow);font-weight:600;font-size:14px;line-height:1.25}
.hint span{flex:1;min-width:0}
.hint button{flex:none;height:36px;border:0;border-radius:9px;background:var(--panel);color:var(--ink);font-weight:700;padding:0 12px}

/* Escala y créditos (siempre sobre el mapa) */
.mapinfo{position:fixed;z-index:3;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(var(--bottom-h,92px) + 6px);display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
.scale{height:16px;min-width:20px;border:2px solid #15181d;border-top:0;background:rgba(255,255,255,.82);color:#15181d;font:700 11px/14px var(--ui);padding:0 4px;white-space:nowrap}
.attrib{font-size:10px;line-height:1.3;background:rgba(255,255,255,.78);color:#222;padding:1px 6px;border-radius:4px;max-width:70vw}
@media (min-width:760px){.mapinfo{left:auto;right:max(10px,env(safe-area-inset-right,0px));align-items:flex-end}}

/* Herramientas */
.toolbar{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.toolbar-inner{pointer-events:auto;width:100%;max-width:560px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:5px}
.tool{min-width:0;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px 6px;color:var(--ink-2);font-size:12px;font-weight:700;letter-spacing:.01em}
.tool svg{width:28px;height:28px}
.tool span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--sign)}
@media (max-width:380px){.tool{font-size:11px;letter-spacing:-.01em}.toolbar-inner{gap:0;padding:4px}}

/* Hoja de detalles */
.sheet{position:fixed;z-index:6;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:var(--toolbar-h,76px);margin:0 auto;max-width:560px;background:var(--panel);border-radius:18px;box-shadow:0 -4px 24px rgba(8,18,40,.3);max-height:calc(100% - var(--toolbar-h,76px) - env(safe-area-inset-top,0px) - 130px);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:10px;padding:10px 14px 14px}
@media (min-width:760px){.sheet{left:max(12px,env(safe-area-inset-left,0px));right:auto;width:400px;margin:0;bottom:calc(var(--toolbar-h,76px) + 4px)}}
.sheet-head{display:flex;align-items:center;gap:10px}
.swatch{flex:none;width:36px;height:36px;display:grid;place-items:center}
.swatch svg{width:34px;height:34px}
.sheet-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.sheet-title b{font:700 21px/1.1 var(--num);letter-spacing:.01em}
.sheet-title small{font-size:13px;color:var(--ink-2);font-weight:600}
.sheet-title small.warn{color:var(--warn-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{flex:none;width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel-2);font:600 30px/1 var(--ui);display:grid;place-items:center;padding:0}
.stepper input{flex:none;width:84px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);text-align:center;font:700 32px/1 var(--num);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper-out{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;padding-left:4px}
.stepper-out b{font:700 18px/1.15 var(--num);font-variant-numeric:tabular-nums}
.stepper-out small{font-size:13px;color:var(--ink-2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:38px;min-width:38px;padding:0 10px;border-radius:19px;border:1.5px solid var(--line);background:var(--panel);font:700 17px/1 var(--num);font-variant-numeric:tabular-nums}
.chip.text{font:600 13.5px/1 var(--ui);height:34px;padding:0 11px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.suggest{border-style:dashed;border-color:var(--sign);color:var(--sign);font:700 14px/1 var(--ui)}
.note{height:42px;width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px;font:500 16px var(--ui)}
.note::placeholder{color:var(--ink-3)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet-actions .btn{flex:1}
.zl{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.zl-nums{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-weight:600;font-size:14px}
.zl-nums b,.zl-money{font:700 22px/1.1 var(--num);font-variant-numeric:tabular-nums;color:var(--ink)}
.zl-sub{display:block;margin-top:2px;font-size:13px;color:var(--ink-2);font-weight:600}
.zone-row{display:flex;gap:8px;flex-wrap:wrap}
.zone-row .note{flex:1 1 140px;width:auto;min-width:0}
.btn.small{height:42px;padding:0 12px;font-size:14px;flex:none}
.tip{margin:0;font-size:13px;color:var(--ink-2);line-height:1.35}
.warnbox{margin:0;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600;line-height:1.35}

/* Botones */
.btn{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:15px;padding:0 14px;white-space:nowrap}
.btn.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.btn.danger{color:var(--danger)}

/* Ventanas */
.modal{position:fixed;inset:0;z-index:10;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.modal-card{width:100%;max-width:560px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);color:var(--ink);border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
@media (min-width:640px){.modal{align-items:center}.modal-card{border-radius:20px;max-height:88%}}
.modal-card>*,.sheet>*{flex-shrink:0}
.modal-head{display:flex;align-items:center;gap:10px}
.modal-head h2{flex:1;margin:0;font:700 26px/1.1 var(--num);letter-spacing:.01em;text-wrap:balance}
.modal-card h3{margin:4px 0 0;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.modal-card p{margin:0;line-height:1.45}
.figure{display:flex;flex-direction:column;gap:2px;background:#0a57d6;color:#fff;border-radius:16px;padding:14px 16px}
.figure span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.figure strong{font:700 46px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.figure small{font-size:13.5px;font-weight:600;opacity:.92}
.table-wrap{overflow-x:auto}
table.money{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.money th,table.money td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.money th:first-child{text-align:left}
table.money thead th{font-size:12px;color:var(--ink-2);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
table.money td{font:700 17px/1.2 var(--num)}
dl.tally{margin:0;display:flex;flex-direction:column}
dl.tally div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
dl.tally dt{color:var(--ink-2);font-weight:600}
dl.tally dd{margin:0;font:700 18px/1.2 var(--num);font-variant-numeric:tabular-nums;text-align:right}
dl.tally div.total{border-bottom:0;border-top:2px solid var(--ink)}
dl.tally div.total dt{color:var(--ink);font-weight:700}
.basis{font-size:13.5px;color:var(--ink-2)}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-actions .btn{flex:1}
.cfg{display:flex;flex-direction:column;gap:14px}
.cfg-row{display:flex;flex-direction:column;gap:5px}
.cfg-row label{font-weight:700;font-size:14.5px}
.cfg-row .help{font-size:13px;color:var(--ink-2);line-height:1.35}
.cfg-row .inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg-row input[type=number]{width:120px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);padding:0 10px;font:700 20px var(--num);font-variant-numeric:tabular-nums}
.cfg-row input[type=range]{flex:1;min-width:140px;accent-color:var(--sign);height:32px}
.cfg-row output{font:700 20px var(--num);min-width:52px}
.derived{font:700 15px var(--ui);color:var(--sign)}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px}
.menu-item b{font-size:15.5px}
.menu-item small{font-size:13px;color:var(--ink-2);font-weight:500}
.menu-item.danger b{color:var(--danger)}
.legend{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.legend li{display:flex;gap:12px;align-items:flex-start}
.legend svg{width:30px;height:30px;flex:none}
.legend b{display:block}
.legend span{color:var(--ink-2);font-size:14px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;color:var(--ink-2);font-size:14px}
.saved-note{font-size:13px;color:var(--ink-2)}

/* Aviso breve */
.toast{position:fixed;z-index:12;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom-h,92px) + 44px);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--panel);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;font-weight:600;font-size:14.5px;line-height:1.3}
.toast button{flex:none;border:0;background:transparent;color:var(--toast-act);font-weight:700;padding:4px 2px}
/* Aviso de cambios sin guardar */
.icon-btn{position:relative}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:#ff6a00;box-shadow:0 0 0 2px var(--panel)}

/* Espacios de guardado */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slot.active{border-color:var(--sign);box-shadow:inset 0 0 0 1px var(--sign)}
.slot-top{display:flex;align-items:baseline;gap:10px;min-width:0}
.slot-num{flex:none;width:22px;height:22px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;font:700 14px/1 var(--num);color:var(--ink-2);align-self:center}
.slot-name{flex:1;min-width:0;font:700 20px/1.15 var(--num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-name.empty{color:var(--ink-3);font-weight:600}
.badge{flex:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--sign);border-radius:6px;padding:3px 7px;align-self:center}
.slot-meta{font-size:13px;color:var(--ink-2);font-weight:600;margin-top:-4px}
.slot-actions{display:flex;gap:6px;flex-wrap:wrap}
.slot-actions .btn{height:40px;font-size:14px;padding:0 12px;flex:1 1 auto}
.field-label{font-weight:700;font-size:14.5px;margin-bottom:-8px}
.text-input{height:50px;width:100%;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:0 14px;font:600 18px var(--ui)}

/* Recorte para exportar */
.cropbar{position:fixed;z-index:7;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.seg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:var(--panel-2);border-radius:10px;padding:3px}
.seg button{min-width:0;height:40px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;font-weight:700;font-size:14px}
.seg button svg{width:20px;height:20px;flex:none}
.seg button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.croppanel{position:fixed;z-index:7;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.croppanel .lead{margin:0;font-weight:600;font-size:14.5px;line-height:1.35}
.croppanel .lead b{font:700 20px/1.2 var(--num);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--sign)}
.out-actions{display:flex;gap:8px}
.out-actions .btn{flex:1}
body.cropping .toolbar,body.cropping .sheet,body.cropping .hint,body.cropping .topbar,body.cropping #btnExport{display:none!important}
body.cropping .map-ctrls{top:calc(env(safe-area-inset-top,0px) + 74px)}
.preview{display:block;max-width:100%;max-height:46vh;margin:0 auto;border-radius:10px;border:1px solid var(--line);background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--panel) 0 50%) 0 0/16px 16px}
.busy-line{display:flex;align-items:center;gap:12px;font-weight:600}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sign);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:399px){.topbar .brand{display:none}.topbar{gap:6px}}
@media (max-width:440px){.seg button{font-size:13px;gap:4px;padding:0 2px}.seg button svg{width:17px;height:17px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

<body>
<canvas id="map" aria-label="Mapa del centro de Tapachula"></canvas>

<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">E</span><span class="brand-name"><b>Parquímetros</b><small>Centro · Tapachula</small></span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnUndo" aria-label="Deshacer" disabled></button>
  <button class="icon-btn" id="btnSave" aria-label="Guardar trabajo"></button>
  <button class="pill" id="btnSummary" aria-label="Ver resumen"><b id="pillAmount">$0</b><small>/mes</small></button>
  <button class="icon-btn" id="btnMenu" aria-label="Menú"></button>
</header>

<div class="map-ctrls">
  <button class="icon-btn" id="btnZoomIn" aria-label="Acercar"></button>
  <button class="icon-btn" id="btnZoomOut" aria-label="Alejar"></button>
  <button class="icon-btn" id="btnLocate" aria-label="Mi ubicación"></button>
  <button class="icon-btn" id="btnLayers" aria-label="Cambiar mapa"></button>
  <button class="icon-btn" id="btnExport" aria-label="Exportar un recorte del mapa"></button>
</div>

<div class="hint" id="hint" hidden><span id="hintText"></span><button id="hintDone">Terminar</button></div>

<div class="cropbar" id="cropbar" hidden>
  <div class="seg" role="group" aria-label="Forma del recorte">
    <button data-shape="rect" aria-pressed="true"></button>
    <button data-shape="circle" aria-pressed="false"></button>
    <button data-shape="free" aria-pressed="false"></button>
  </div>
  <button class="icon-btn flat" id="cropClose" aria-label="Salir del recorte"></button>
</div>
<section class="croppanel" id="croppanel" hidden aria-live="polite"></section>

<div class="mapinfo"><div class="scale" id="scale">50 m</div><div class="attrib" id="attrib"></div></div>

<nav class="toolbar" id="toolbar" aria-label="Herramientas"><div class="toolbar-inner" id="tools"></div></nav>

<section class="sheet" id="sheet" hidden aria-live="polite"></section>

<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<div class="toast" id="toast" hidden role="status"></div>

<input type="file" id="fileInput" accept=".json,.txt,application/json,text/plain" hidden>

<noscript><p style="position:fixed;inset:20px;background:#fff;padding:20px">Esta app necesita JavaScript.</p></noscript>

<script>
(() => {
'use strict';

/* ================= Datos de la ley y valores iniciales ================= */
const STORE_KEY = 'parquimetros-tapachula-v1';
const CIRC = 40075016.686;
const MINZ = 3, MAXZ = 21;
const DEFAULT_VIEW = { lat: 14.9068, lng: -92.2633, z: 17 };   // Parque Central Miguel Hidalgo
const DEFAULT_CONFIG = {
  uma: 117.31,        // UMA diaria 2026 (INEGI, vigente desde 1 feb 2026)
  tarifaUma: 0.06,    // Ley de Ingresos Tapachula 2026, art. 33 fracc. I, inciso A: por cada hora
  horasDia: 12,       // 08:00 a 20:00
  diasAnio: 306,      // lunes a sábado de 2026 (313) menos 7 festivos oficiales
  ocupacion: 70,      // % del tiempo ocupado (supuesto ajustable)
  motosPorCajon: 3,
  largoCajon: 6       // metros por cajón de auto, solo para la sugerencia
};
const ZONE_DEFAULT = { len: 40, wid: 10 };
const NUMFONT = '"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif';

const TYPES = {
  no:   { zone: true, color: '#e0221b', fill: 'rgba(224,34,27,0.18)', label: 'Zona roja', sub: 'no se puede', letter: 'R' },
  si:   { zone: true, color: '#0a57d6', fill: 'rgba(10,87,214,0.28)', label: 'Zona azul', sub: 'sí se puede', letter: 'A' },
  auto: { color: '#13a84a', text: '#ffffff', shape: 'circle', label: 'Autos' },
  moto: { color: '#ffc400', text: '#151515', shape: 'circle', label: 'Motos' },
  obst: { color: '#ff6a00', text: '#ffffff', shape: 'square', label: 'Anomalía' }
};
const OBST_KINDS = ['Portón o cochera', 'Prohibido', 'Rampa', 'Parada de bus', 'Hidrante', 'Otro'];

const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const BASES = {
  sat: {
    name: 'Satélite',
    attrib: 'Imágenes © Esri, Maxar, Earthstar Geographics',
    layers: [
      { id: 'img', max: 19, url: (z, x, y) => `${ESRI}World_Imagery/MapServer/tile/${z}/${y}/${x}` },
      { id: 'trn', max: 19, url: (z, x, y) => `${ESRI}Reference/World_Transportation/MapServer/tile/${z}/${y}/${x}` }
    ]
  },
  calles: {
    name: 'Calles',
    attrib: '© colaboradores de OpenStreetMap',
    layers: [
      { id: 'osm', max: 19, url: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
        fallback: (z, x, y) => `${ESRI}World_Street_Map/MapServer/tile/${z}/${y}/${x}` }
    ]
  }
};

const ICON = {
  pan: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5l3.2 3.2h-2.3v4.4h-1.8V5.7H8.8L12 2.5zm0 19l-3.2-3.2h2.3v-4.4h1.8v4.4h2.3L12 21.5zM2.5 12l3.2-3.2v2.3h4.4v1.8H5.7v2.3L2.5 12zm19 0l-3.2 3.2v-2.3h-4.4v-1.8h4.4V8.8l3.2 3.2z"/></svg>',
  no: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="1.5" fill="rgba(224,34,27,.18)" stroke="#e0221b" stroke-width="2" stroke-dasharray="3.2 2"/><path d="M9 9.5l6 5M15 9.5l-6 5" stroke="#e0221b" stroke-width="2.2" stroke-linecap="round"/></svg>',
  si: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="11" rx="1.5" fill="rgba(10,87,214,.18)" stroke="#0a57d6" stroke-width="2"/><path d="M9.6 8.75h4.8v1.5h-3v1h2.7v1.5h-2.7v1h3v1.5H9.6z" fill="#0a57d6"/></svg>',
  auto: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#13a84a" stroke="#fff" stroke-width="1.5"/><path d="M6.6 14.6v-2.1l1.5-3a1.2 1.2 0 0 1 1.1-.7h5.6c.5 0 .9.3 1.1.7l1.5 3v2.1z" fill="#fff"/><path d="M9.4 11.7l.8-1.6h3.6l.8 1.6z" fill="#13a84a"/><circle cx="9" cy="15.1" r="1.4" fill="#fff"/><circle cx="15" cy="15.1" r="1.4" fill="#fff"/></svg>',
  moto: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#ffc400" stroke="#fff" stroke-width="1.5"/><circle cx="7.6" cy="14.6" r="2.3" fill="none" stroke="#151515" stroke-width="1.6"/><circle cx="16.4" cy="14.6" r="2.3" fill="none" stroke="#151515" stroke-width="1.6"/><path d="M7.6 14.6l3.1-3.6h3.1l2.6 3.6M13.2 11l1.1-2.3h1.6" fill="none" stroke="#151515" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  obst: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="4" fill="#ff6a00" stroke="#fff" stroke-width="1.5"/><path d="M12 7v6.2" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.5" fill="#fff"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  minus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  locate: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  layers: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5L4.5 11 9 15.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11h8.5a4.5 4.5 0 0 1 0 9H10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  menu: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="18.5" r="2" fill="currentColor"/></svg>',
  close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  save: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h11l3.5 3.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V5A1.5 1.5 0 0 1 5 3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 3.5v4.5h8V3.5M7 20.5v-6h10v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  crop: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 2.5v15h15M2.5 6.5h15v15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  shapeRect: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.2 2.4"/></svg>',
  shapeCircle: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.2 2.4"/></svg>',
  shapeFree: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 15.5C3.6 11.8 5 5.6 11 4.8s9.4 2.9 8.3 7.1-5.2 2.6-6.2 5.9-5.4 3.6-6.8 1.6c-.5-.8-.3-2.3-.8-3.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.2 2.4" stroke-linejoin="round"/></svg>',
  trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15M9.5 6.5V4.5h5v2M6.5 6.5l1 13h9l1-13M10.2 10v6.5M13.8 10v6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

const TOOLS = [
  { id: 'pan', label: 'Mover' },
  { id: 'no', label: 'No' },
  { id: 'si', label: 'Sí' },
  { id: 'auto', label: 'Autos' },
  { id: 'moto', label: 'Motos' },
  { id: 'obst', label: 'Anomalía' }
];
const HINTS = {
  no: 'Arrastra a lo largo de la calle donde NO se puede.',
  si: 'Arrastra a lo largo de la calle donde SÍ se puede.',
  auto: 'Toca dentro de la zona azul para poner cajones de autos.',
  moto: 'Toca donde irán los cajones para motos.',
  obst: 'Toca sobre el portón, prohibido o anomalía.'
};

/* ================= Utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isZone = it => !!(it && TYPES[it.type] && TYPES[it.type].zone);
const fmtMoney0 = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0, minimumFractionDigits: 0 });
const fmtMoney2 = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtNum = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 2 });
const fmtInt = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 0 });
const fmtLen = m => (m < 10 ? m.toFixed(1) : Math.round(m)) + ' m';
const plural = (n, one, many) => `${fmtInt.format(n)} ${n === 1 ? one : many}`;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Estado ================= */
const state = { items: [], config: { ...DEFAULT_CONFIG }, base: 'sat', view: { ...DEFAULT_VIEW }, seenHelp: false, activeSlot: null, dirty: false, autosaveMin: 2 };
let selectedId = null;
let tool = 'pan';
let W = 0, H = 0, dpr = 1;

const canvas = $('#map');
let ctx = canvas.getContext('2d');
/* Destino de dibujo: la pantalla, o un lienzo aparte cuando se exporta un recorte */
let renderView = null, detail = 0, exporting = false;
const vw = () => renderView || state.view;
const sheet = $('#sheet');
const toolbar = $('#toolbar');
const modal = $('#modal');
const modalCard = $('#modalCard');
const toastEl = $('#toast');

function normalizeItem(i) {
  const o = { id: String(i.id || uid()), type: i.type, lat: +i.lat, lng: +i.lng, note: typeof i.note === 'string' ? i.note.slice(0, 300) : '' };
  if (isZone(i)) { o.len = +i.len; o.wid = +i.wid; o.ang = +i.ang; o.num = Math.max(1, Math.round(+i.num || 0)); }
  else { o.n = clamp(Math.round(+i.n || 0), 0, 999); if (i.type === 'obst') o.kind = OBST_KINDS.includes(i.kind) ? i.kind : OBST_KINDS[0]; }
  return o;
}
function validItem(i) {
  if (!i || !TYPES[i.type] || !isFinite(i.lat) || !isFinite(i.lng)) return false;
  if (isZone(i)) return isFinite(i.len) && isFinite(i.wid) && isFinite(i.ang) && i.len > 0 && i.wid > 0;
  return isFinite(i.n);
}
function sanitizeConfig(c) {
  const o = { ...DEFAULT_CONFIG };
  if (c) for (const k in DEFAULT_CONFIG) { const v = parseFloat(c[k]); if (isFinite(v) && v >= 0) o[k] = v; }
  o.ocupacion = clamp(o.ocupacion, 0, 100);
  return o;
}
function fixZoneNumbers() {
  for (const t of ['si', 'no']) {
    const seen = new Set();
    for (const z of state.items) if (z.type === t) {
      if (!z.num || seen.has(z.num)) z.num = nextNum(t);
      seen.add(z.num);
    }
  }
}
function nextNum(type) { let m = 0; for (const z of state.items) if (z.type === type && z.num > m) m = z.num; return m + 1; }
function zoneLabel(z) { return TYPES[z.type].letter + z.num; }

function load() {
  let d = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { d = null; }
  if (!d) return;
  if (Array.isArray(d.items)) state.items = d.items.filter(validItem).map(normalizeItem);
  state.config = sanitizeConfig(d.config);
  if (d.base && BASES[d.base]) state.base = d.base;
  if (d.view && isFinite(d.view.lat) && isFinite(d.view.lng) && isFinite(d.view.z)) state.view = { lat: +d.view.lat, lng: +d.view.lng, z: clamp(+d.view.z, MINZ, MAXZ) };
  state.seenHelp = !!d.seenHelp;
  state.activeSlot = Number.isInteger(d.activeSlot) && d.activeSlot >= 0 && d.activeSlot < 4 ? d.activeSlot : null;
  state.dirty = !!d.dirty;
  if ([0, 1, 2, 5, 10].includes(d.autosaveMin)) state.autosaveMin = d.autosaveMin;
  fixZoneNumbers();
}
let saveTimer = 0;
function saveNow() {
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ app: 'parquimetros-tapachula', v: 1, savedAt: new Date().toISOString(), items: state.items, config: state.config, base: state.base, view: state.view, seenHelp: state.seenHelp, activeSlot: state.activeSlot, dirty: state.dirty, autosaveMin: state.autosaveMin }));
  } catch (e) { /* sin almacenamiento disponible */ }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }

/* Deshacer */
const undoStack = [];
let lastKey = null, lastTime = 0;
function beginChange(key) {
  const now = Date.now();
  if (key && key === lastKey && now - lastTime < 1500) { lastTime = now; return; }
  undoStack.push(JSON.stringify(state.items));
  if (undoStack.length > 60) undoStack.shift();
  lastKey = key || null; lastTime = now;
  updateUndo();
}
function undo() {
  if (!undoStack.length) return;
  state.items = JSON.parse(undoStack.pop());
  lastKey = null;
  if (selectedId && !getItem(selectedId)) selectedId = null;
  buildSheet();
  afterChange();
  updateUndo();
  toast('Se deshizo el último cambio');
}
function updateUndo() { $('#btnUndo').disabled = undoStack.length === 0; }
function afterChange() { markDirty(); saveSoon(); updateSummary(); render(); }
function getItem(id) { return id ? state.items.find(i => i.id === id) || null : null; }

/* ================= Proyección ================= */
const ws = z => 256 * Math.pow(2, z);
function project(lat, lng, z) {
  const S = ws(z), s = Math.sin(clamp(lat, -85.05, 85.05) * Math.PI / 180);
  return { x: (lng + 180) / 360 * S, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * S };
}
function unproject(x, y, z) {
  const S = ws(z), n = Math.PI - 2 * Math.PI * y / S;
  return { lat: 180 / Math.PI * Math.atan(Math.sinh(n)), lng: x / S * 360 - 180 };

function onPointerEnd(e) {
  if (!pointers.has(e.pointerId)) return;
  const last = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (!gesture) return;
  if (gesture.type === 'pinch') {
    if (pointers.size === 1) { const [id, q] = [...pointers.entries()][0]; gesture = { type: 'pan', id, start: q, last: q, moved: true }; }

    return;
  }

  const g = gesture; gesture = null;
  const cancelled = e.type === 'pointercancel';
  const p = cancelled ? last : pt(e);
  if (g.type === 'draw') { if (!cancelled) finishDraw(g, p); render(); return; }
  if (g.type === 'crop') { if (!cancelled) { if (dist(p, g.pts[g.pts.length - 1]) > 0) g.pts.push(p); finishCrop(g); } render(); return; }
  if (g.type === 'pan') { if (!g.moved && !cancelled) onTap(p); return; }

canvas.addEventListener('pointercancel', onPointerEnd);

canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

function endGesture() {
  if (gesture && (gesture.type === 'drag' || gesture.type === 'handle') && gesture.moved) afterChange();
  gesture = null;
}

function onTap(p) {
  const hit = hitTest(p);
  if (tool === 'auto' || tool === 'moto' || tool === 'obst') {
    if (hit && !isZone(hit)) { select(hit.id); return; }
    placeMarker(tool, toLatLng(p.x, p.y));
    return;
  }
  const now = performance.now();
  if (!hit && lastTap && now - lastTap.t < 330 && dist(p, lastTap.p) < 30) {
    lastTap = null; animateZoomAround(p, Math.round(state.view.z) + 1); return;
  }
  lastTap = { t: now, p };
  select(hit ? hit.id : null);
}

function finishDraw(g, endP) {
  let it;
  const type = g.zoneType;

    const z = zoneFromDrag(g.start, endP, type);
    if (z.len < 2) { z.len = ZONE_DEFAULT.len; z.ang = 0; }
    it = { id: uid(), type, lat: z.lat, lng: z.lng, len: Math.round(z.len * 10) / 10, wid: ZONE_DEFAULT.wid, ang: z.ang, note: '', num: nextNum(type) };
  } else {
    const ll = toLatLng(endP.x, endP.y);
    it = { id: uid(), type, lat: ll.lat, lng: ll.lng, len: ZONE_DEFAULT.len, wid: ZONE_DEFAULT.wid, ang: 0, note: '', num: nextNum(type) };
  }
  beginChange();
  state.items.push(it);
  setTool('pan');
  select(it.id);
  afterChange();
}

function placeMarker(type, ll) {
  const it = { id: uid(), type, lat: ll.lat, lng: ll.lng, n: 1, note: '' };
  if (type === 'obst') it.kind = OBST_KINDS[0];
  beginChange();
  state.items.push(it);

  afterChange();
}

function hoverCursor(e) {
  if (e.pointerType !== 'mouse' || gesture) return;
  const p = pt(e);
  let c = (tool === 'pan' && !crop) ? 'grab' : 'crosshair';
  if (tool === 'pan' && !crop) {
    const sel = getItem(selectedId);
    if (isZone(sel) && hitHandle(sel, p)) c = 'move';
    else { const h = hitTest(p); if (h) c = (h.id === selectedId && !isZone(h)) ? 'move' : 'pointer'; }

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cancelAnimationFrame(animId);
  const d = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
  zoomAround(pt(e), state.view.z - clamp(d, -150, 150) / 300);

function rates() {
  const c = state.config;

}

    else if (m.type === 'obst') obst += m.n;

  const autosNet = Math.max(0, autos - obst), motos = motosCaj * state.config.motosPorCajon;
  return { autos, motosCaj, obst, autosNet, motos, plazas: autosNet + motos };
}
function money(plazas) {
  const r = rates(), hora = plazas * r.tarifa, dia = hora * r.horas, anio = dia * r.dias, mes = anio / 12;
  return { hora, dia, mes, anio, est: { hora: hora * r.occ, dia: dia * r.occ, mes: mes * r.occ, anio: anio * r.occ } };
}
const markersOnly = () => state.items.filter(i => !isZone(i));

  const blue = zonesOf('si');
  return markersOnly().filter(m => m.type !== 'obst' && !blue.some(z => inZone(z, m.lat, m.lng))).length;
}
function updateSummary() {

  $('#pillAmount').textContent = fmtMoney0.format(m.est.mes);
  $('#btnSummary').setAttribute('aria-label', `Ingreso estimado ${fmtMoney0.format(m.est.mes)} al mes. Ver resumen`);

/* Si el panel de abajo tapa lo seleccionado, mueve el mapa para que se vea */
function ensureVisible(it) {
  const hint = $('#hint');
  const top = (hint.hidden ? document.querySelector('.topbar') : hint).getBoundingClientRect().bottom + 10;
  const wide = window.innerWidth >= 760;
  let bottom = toolbar.getBoundingClientRect().top - 10, left = 10;
  if (!sheet.hidden && !wide) bottom = Math.min(bottom, sheet.getBoundingClientRect().top - 12 - $('.mapinfo').getBoundingClientRect().height);
  if (!sheet.hidden && wide) left = sheet.getBoundingClientRect().right + 10;
  const right = W - 64;
  let pts;
  if (isZone(it)) { const Hp = handlePos(it); pts = [...zoneCorners(Hp.g), Hp.a, Hp.b, Hp.w].map(p => ({ x: p.x, y: p.y })); pts.push(...pts.map(p => ({ x: p.x, y: p.y + 14 })), ...pts.map(p => ({ x: p.x, y: p.y - 14 }))); }
  else { const p = toScreen(it.lat, it.lng), r = markerR() + 12; pts = [{ x: p.x - r, y: p.y - r }, { x: p.x + r, y: p.y + r }]; }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const fit = (lo, hi, a, b) => (hi - lo > b - a) ? (a + b) / 2 - (lo + hi) / 2 : hi > b ? b - hi : lo < a ? a - lo : 0;
  const dx = fit(Math.min(...xs), Math.max(...xs), left, right), dy = fit(Math.min(...ys), Math.max(...ys), top, bottom);
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
  const z = state.view.z, c0 = project(state.view.lat, state.view.lng, z);
  animate(e => setCenter(unproject(c0.x - dx * e, c0.y - dy * e, z)), 280);
}
let ro = null;
function updateBottomH() {

    const cp = $('#croppanel'), r = cp.hidden ? null : cp.getBoundingClientRect();

  const tb = toolbar.getBoundingClientRect();

function onSheetClick(e) {

function confirmClear() {

    beginChange(); state.items = []; closeModal(); select(null); afterChange(); toast('Se borró todo', 'Deshacer', undo);
  });

function fitAll() {
  if (!state.items.length) { flyTo(DEFAULT_VIEW.lat, DEFAULT_VIEW.lng, DEFAULT_VIEW.z); toast('Todavía no hay marcas'); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const it of state.items) { const p = project(it.lat, it.lng, 0); x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  const dx = Math.max(x1 - x0, 1e-7), dy = Math.max(y1 - y0, 1e-7);
  const z = clamp(Math.log2(Math.min((W - 120) / dx, (H - 260) / dy)), 12, 19);
  const c = unproject((x0 + x1) / 2, (y0 + y1) / 2, 0);
  flyTo(c.lat, c.lng, z);
}

/* ================= Archivos ================= */
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
async function deliver(name, data, mime, share) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  if (share && typeof navigator.share === 'function') {
    const tries = [new File([blob], name, { type: mime })];
    if (/\.json$/.test(name)) tries.push(new File([blob], name.replace(/\.json$/, '.txt'), { type: 'text/plain' }));
    for (const f of tries) {
      try {
        if (navigator.canShare && !navigator.canShare({ files: [f] })) continue;
        await navigator.share({ files: [f], title: name });
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    toast('Este equipo no deja compartir el archivo; se descargará.');
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Archivo guardado en Descargas');
}
function exportBackup(share) {
  const data = { app: 'parquimetros-tapachula', v: 1, savedAt: new Date().toISOString(), items: state.items, config: state.config };
  deliver(`respaldo-parquimetros-${stamp()}.json`, JSON.stringify(data, null, 1), 'application/json', share);
}
function csvCell(v) { const s = v === undefined || v === null ? '' : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCSV() {
  const cfg = state.config, blue = zonesOf('si');
  const rows = [['Tipo', 'Etiqueta', 'Cajones', 'Lugares que cuenta', 'Largo (m)', 'Ancho (m)', 'Zona azul donde está', 'Detalle', 'Nota', 'Latitud', 'Longitud']];
  const zs = state.items.filter(isZone).sort((a, b) => a.type === b.type ? a.num - b.num : (a.type === 'si' ? -1 : 1));
  for (const z of zs) rows.push([z.type === 'si' ? 'Zona azul (sí se puede)' : 'Zona roja (no se puede)', zoneLabel(z), '', '', z.len.toFixed(1), z.wid.toFixed(1), '', '', z.note, z.lat.toFixed(6), z.lng.toFixed(6)]);
  for (const m of markersOnly()) {
    const zin = blue.filter(z => inZone(z, m.lat, m.lng)).map(zoneLabel).join(' ');
    const lugares = m.type === 'auto' ? m.n : m.type === 'moto' ? m.n * cfg.motosPorCajon : -m.n;
    const detalle = m.type === 'moto' ? `${cfg.motosPorCajon} motos por cajón` : m.type === 'obst' ? m.kind : '';
    rows.push([TYPES[m.type].label, '', m.n, lugares, '', '', zin || (m.type === 'obst' ? '' : 'Fuera de zona azul'), detalle, m.note, m.lat.toFixed(6), m.lng.toFixed(6)]);
  }
  const c = countMarkers(markersOnly()), mo = money(c.plazas), r = rates();
  rows.push([], ['Resumen']);
  rows.push(['Cajones de autos', c.autos], ['Lugares que quitan las anomalías', -c.obst], ['Lugares de autos', c.autosNet],
    ['Cajones de motos', c.motosCaj], ['Motos por cajón', cfg.motosPorCajon], ['Lugares de motos', c.motos], ['Total de lugares que pagan', c.plazas], [],
    ['Valor UMA ($)', cfg.uma], ['Tarifa por hora (UMA)', cfg.tarifaUma], ['Tarifa por hora ($)', r.tarifa.toFixed(2)], ['Horas de cobro al día', cfg.horasDia],
    ['Días de cobro al año', cfg.diasAnio], ['Ocupación estimada (%)', cfg.ocupacion], [],
    ['Ingreso', 'Estimado', 'Máximo (100%)'],
    ['Por hora', mo.est.hora.toFixed(2), mo.hora.toFixed(2)], ['Por día', mo.est.dia.toFixed(2), mo.dia.toFixed(2)],
    ['Por mes', mo.est.mes.toFixed(2), mo.mes.toFixed(2)], ['Por año', mo.est.anio.toFixed(2), mo.anio.toFixed(2)], [],
    ['Fundamento', 'Ley de Ingresos del Municipio de Tapachula 2026, art. 33, fracc. I']);
  return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function exportCSV() { deliver(`parquimetros-centro-${stamp()}.csv`, buildCSV(), 'text/csv', typeof navigator.share === 'function' && matchMedia('(pointer: coarse)').matches); }

/* ================= Ubicación ================= */
let watchId = null, wantCenter = false, geoWasOn = false;
const btnLocate = $('#btnLocate');
function startGeo() {
  if (!('geolocation' in navigator)) { toast('Este navegador no da la ubicación.'); return; }
  if (!window.isSecureContext) { toast('La ubicación solo funciona al abrir la app desde su dirección https.'); return; }
  if (watchId !== null) { if (geo) flyTo(geo.lat, geo.lng, Math.max(state.view.z, 18)); else wantCenter = true; return; }
  wantCenter = true;
  btnLocate.classList.add('busy');
  watchId = navigator.geolocation.watchPosition(onGeo, onGeoErr, { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
}
function onGeo(pos) {
  geo = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy || 0 };
  btnLocate.classList.remove('busy'); btnLocate.classList.add('active');
  if (wantCenter) { wantCenter = false; flyTo(geo.lat, geo.lng, Math.max(state.view.z, 18)); }
  render();
}
function onGeoErr(err) {
  btnLocate.classList.remove('busy', 'active');
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  toast(err && err.code === 1 ? 'Sin permiso de ubicación. Actívalo para esta página en el navegador.' : 'No se pudo obtener tu ubicación. Revisa que el GPS esté encendido.');
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    autosaveOnLeave();
    saveNow();
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; geoWasOn = true; }
  } else if (geoWasOn) {
    geoWasOn = false; wantCenter = false;
    watchId = navigator.geolocation.watchPosition(onGeo, onGeoErr, { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
  }
});
window.addEventListener('pagehide', () => { autosaveOnLeave(); saveNow(); });

/* ================= Espacios de guardado ================= */
const SLOTS_KEY = 'parquimetros-tapachula-slots-v1';
const AUTO_OPTIONS = [0, 1, 2, 5, 10];
let slots = [null, null, null, null];
let lastSlotSave = Date.now();
let hintedSave = false;
const fmtWhen = new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

function loadSlots() {
  try {
    const a = JSON.parse(localStorage.getItem(SLOTS_KEY) || 'null');
    if (Array.isArray(a)) slots = [0, 1, 2, 3].map(i => (a[i] && typeof a[i].name === 'string' && Array.isArray(a[i].items)) ? a[i] : null);
  } catch (_) { /* nada guardado todavía */ }
  if (state.activeSlot !== null && !slots[state.activeSlot]) state.activeSlot = null;
}
function writeSlots() {
  try { localStorage.setItem(SLOTS_KEY, JSON.stringify(slots)); return true; }
  catch (_) { toast('No hay espacio en este equipo para guardar. Borra un espacio o guarda un respaldo.'); return false; }
}
function markDirty() {
  state.dirty = true;
  updateSaveUI();
  if (state.activeSlot === null && !hintedSave && state.items.length >= 3) {
    hintedSave = true;
    setTimeout(() => toast('Ponle nombre a tu trabajo para guardarlo.', 'Guardar', openSlots), 700);
  }
}
function slotMeta(s) {
  const zn = s.items.filter(isZone).length, mk = s.items.length - zn;
  return `${fmtWhen.format(new Date(s.savedAt))} · ${plural(zn, 'zona', 'zonas')} · ${plural(mk, 'marca', 'marcas')}`;
}
function defaultName() { return 'Levantamiento ' + new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short' }).format(new Date()); }
function updateSaveUI() {
  const btn = $('#btnSave');
  let dot = btn.querySelector('.dot');
  const show = state.dirty && (state.activeSlot !== null || state.items.length > 0);
  if (show && !dot) { dot = document.createElement('span'); dot.className = 'dot'; btn.append(dot); }
  if (!show && dot) dot.remove();
  btn.setAttribute('aria-label', show ? 'Guardar trabajo (hay cambios sin guardar)' : 'Guardar trabajo');
  const s = state.activeSlot !== null ? slots[state.activeSlot] : null;
  $('.brand-name small').textContent = s ? s.name : 'Centro · Tapachula';
}
function saveToSlot(i, name, silent) {
  const prev = slots[i];
  slots[i] = {
    name: String(name).trim().slice(0, 60) || `Espacio ${i + 1}`, savedAt: new Date().toISOString(),
    items: JSON.parse(JSON.stringify(state.items)), config: { ...state.config }, view: { ...state.view }, base: state.base
  };
  if (!writeSlots()) { slots[i] = prev; return false; }
  state.activeSlot = i; state.dirty = false; lastSlotSave = Date.now();
  saveNow(); updateSaveUI();
  if (!silent) toast(`Guardado en «${slots[i].name}»`);
  return true;
}
function openSlot(i) {
  const s = slots[i]; if (!s) return;
  beginChange();
  state.items = s.items.filter(validItem).map(normalizeItem);
  state.config = sanitizeConfig(s.config);
  if (s.base && BASES[s.base]) state.base = s.base;
  fixZoneNumbers();
  select(null); updateAttrib(); updateSummary(); render();
  state.activeSlot = i; state.dirty = false; lastSlotSave = Date.now();
  saveNow(); updateSaveUI();
  if (s.view && isFinite(s.view.lat) && isFinite(s.view.lng) && isFinite(s.view.z)) flyTo(s.view.lat, s.view.lng, clamp(s.view.z, MINZ, MAXZ));
  toast(`Abriste «${s.name}»`);
}
function startNew() {
  beginChange();
  state.items = []; state.activeSlot = null; state.dirty = false;
  select(null); updateSummary(); render(); saveNow(); updateSaveUI();
  toast('Levantamiento nuevo, mapa limpio', 'Deshacer', undo);
}
function confirmBox(title, text, okLabel, danger, onOk, onCancel) {

    <div class="modal-head"><h2>${esc(title)}</h2>${closeBtn}</div>

    card.querySelector('[data-yes]').onclick = () => { closeModal(); onOk(); };
  });
}
function openSlots() {

    g.fillStyle = '#121722'; g.font = `500 ${fL}px ${UIFONT}`;

    y += 30 * u - lh + lg.rowH * 0.6;
    g.font = `600 ${17 * u}px ${UIFONT}`;
    for (const it of lg.items) {

      swatch(g, padX + it.x, yy - lg.sw * 0.75, lg.sw, it.col, it.kind);

}

/* PDF de una hoja, hecho a mano: imagen JPEG + texto Helvetica */
const WINANSI = { '€': 128, '‚': 130, '„': 132, '…': 133, '‘': 145, '’': 146, '“': 147, '”': 148, '•': 149, '–': 150, '—': 151, '≈': 126, '−': 45 };
function pdfStr(s) {
  let o = '';
  for (const ch of String(s)) {
    let code = ch.charCodeAt(0);
    if (WINANSI[ch] !== undefined) code = WINANSI[ch];
    else if (ch === '→') { o += '->'; continue; }
    else if (code > 255) code = 63;
    const c = String.fromCharCode(code);
    o += (c === '\\' || c === '(' || c === ')') ? '\\' + c : c;
  }

}
const latin1 = s => { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 255; return b; };
function wrapChars(text, maxW, fs) {
  const avg = fs * 0.53, out = []; let line = '';
  for (const w of text.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (t.length * avg > maxW && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
function buildPdf(jpeg, iw, ih, info) {
  const land = iw > ih * 1.15, PW = land ? 792 : 612, PH = land ? 612 : 792, M = 40;
  const f = n => (Math.round(n * 100) / 100).toString();
  const rgb = hex => [1, 3, 5].map(i => (parseInt(hex.substr(i, 2), 16) / 255).toFixed(3)).join(' ');
  let cs = '', top = PH - M, bottom = M;
  let lines = [], legendRows = [];
  if (info) {
    cs += `BT /F2 18 Tf 0.07 0.09 0.13 rg ${M} ${f(top - 16)} Td ${pdfStr(info.title)} Tj ET\n`;
    cs += `BT /F1 10 Tf 0.29 0.33 0.41 rg ${M} ${f(top - 32)} Td ${pdfStr(info.sub)} Tj ET\n`;
    top -= 46;
    lines = info.lines.flatMap(l => wrapChars(l, PW - 2 * M, 9.5));
    let x = 0, row = [];
    for (const it of info.legend) {
      const w = 14 + it[1].length * 9 * 0.53 + 16;
      if (x && x + w > PW - 2 * M) { legendRows.push(row); row = []; x = 0; }
      row.push(it); x += w;
    }
    legendRows.push(row);
    bottom = M + lines.length * 13 + legendRows.length * 16 + 22;
  }
  const aw = PW - 2 * M, ah = top - bottom, sc = Math.min(aw / iw, ah / ih);
  const dw = iw * sc, dh = ih * sc, dx = M + (aw - dw) / 2, dy = top - dh;
  cs += `q ${f(dw)} 0 0 ${f(dh)} ${f(dx)} ${f(dy)} cm /Im1 Do Q\n`;
  cs += `0.84 0.86 0.9 RG 0.75 w ${f(dx)} ${f(dy)} ${f(dw)} ${f(dh)} re S\n`;
  if (info) {
    let y = dy - 18;
    for (const l of lines) { cs += `BT /F1 9.5 Tf 0.07 0.09 0.13 rg ${M} ${f(y)} Td ${pdfStr(l)} Tj ET\n`; y -= 13; }
    y -= 6;
    const K = 0.5523;
    for (const row of legendRows) {
      let x = M;
      for (const [col, label, kind] of row) {
        const c = rgb(col), sy = y - 1.5;
        if (kind === 'circle') {
          const r = 4.5, cx = x + 5, cy = sy + 4;
          cs += `${c} rg ${f(cx + r)} ${f(cy)} m ${f(cx + r)} ${f(cy + r * K)} ${f(cx + r * K)} ${f(cy + r)} ${f(cx)} ${f(cy + r)} c ${f(cx - r * K)} ${f(cy + r)} ${f(cx - r)} ${f(cy + r * K)} ${f(cx - r)} ${f(cy)} c ${f(cx - r)} ${f(cy - r * K)} ${f(cx - r * K)} ${f(cy - r)} ${f(cx)} ${f(cy - r)} c ${f(cx + r * K)} ${f(cy - r)} ${f(cx + r)} ${f(cy - r * K)} ${f(cx + r)} ${f(cy)} c f\n`;
        } else if (kind === 'square') cs += `${c} rg ${f(x)} ${f(sy - 0.5)} 10 10 re f\n`;
        else cs += `${c} RG 1.2 w ${f(x)} ${f(sy + 1)} 10 6 re S\n`;
        cs += `BT /F1 9 Tf 0.29 0.33 0.41 rg ${f(x + 14)} ${f(y)} Td ${pdfStr(label)} Tj ET\n`;
        x += 14 + label.length * 9 * 0.53 + 16;
      }
      y -= 16;
    }
  }
  const objs = {
    1: '<< /Type /Catalog /Pages 2 0 R >>',
    2: '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    3: `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im1 4 0 R >> /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 7 0 R >>`,
    5: '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
    6: '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'
  };
  const chunks = [], offs = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? latin1(x) : x; chunks.push(b); len += b.length; };
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  for (let i = 1; i <= 7; i++) {
    offs[i] = len;
    if (i === 4) {
      push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
      push(jpeg); push('\nendstream\nendobj\n');
    } else if (i === 7) {
      const b = latin1(cs);
      push(`7 0 obj\n<< /Length ${b.length} >>\nstream\n`); push(b); push('\nendstream\nendobj\n');
    } else push(`${i} 0 obj\n${objs[i]}\nendobj\n`);
  }
  const xref = len;
  let x = 'xref\n0 8\n0000000000 65535 f \n';
  for (let i = 1; i <= 7; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 8 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

  let o = 0; for (const c of chunks) { out.set(c, o); o += c.length; }

}
async function makePdf(cv, info, withData) {
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
  const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(cv, 0, 0);
  const jb = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('jpeg')), 'image/jpeg', 0.9));

}
function showExportResult(out, missing, total) {
  const size = out.blob.size >= 1048576 ? (out.blob.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(out.blob.size / 1024)) + ' KB';
  const canShare = typeof navigator.share === 'function';
  const warn = !missing ? '' : missing >= total * 0.8
    ? '<p class="warnbox">No se pudo bajar el mapa de fondo (sin señal o el servidor no lo permitió). Las zonas y marcas sí salen completas.</p>'
    : `<p class="warnbox">Faltaron ${plural(missing, 'pedazo', 'pedazos')} del mapa de fondo. Las zonas y marcas sí salen completas.</p>`;
  openModal(`
    <div class="modal-head"><h2>Recorte listo</h2>${closeBtn}</div>
    <img class="preview" src="${out.previewUrl}" alt="Vista previa del recorte">
    <p class="tip">${esc(out.name)} · ${size}</p>
    ${warn}
    <div class="out-actions">${canShare ? '<button class="btn" data-o="share">Compartir</button>' : ''}<button class="btn primary" data-o="save">Descargar</button></div>`,
  card => {
    card.querySelectorAll('[data-o]').forEach(b => { b.onclick = () => deliver(out.name, out.blob, out.mime, b.dataset.o === 'share'); });
  }, () => URL.revokeObjectURL(out.previewUrl));
}

/* ================= Aviso breve ================= */
let toastTimer = 0;
function toast(msg, actLabel, actFn) {
  toastEl.innerHTML = '';
  const s = document.createElement('span'); s.textContent = msg; toastEl.append(s);
  if (actLabel) { const b = document.createElement('button'); b.textContent = actLabel; b.onclick = () => { hideToast(); actFn(); }; toastEl.append(b); }
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actLabel ? 5000 : 2800);
}
function hideToast() { toastEl.hidden = true; }

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = canvas.clientWidth; H = canvas.clientHeight;

  draw(); updateBottomH();
}
function readTheme() { mapBg = getComputedStyle(document.documentElement).getPropertyValue('--map-bg').trim() || '#d8dee6'; render(); }

function init() {
  load();
  loadSlots();
  $('#btnUndo').innerHTML = ICON.undo;
  $('#btnMenu').innerHTML = ICON.menu;
  $('#btnZoomIn').innerHTML = ICON.plus;

  buildToolbar(); setTool('pan');

  document.addEventListener('keydown', e => {
    if (e.target.matches && e.target.matches('input, textarea')) return;
    if (!modal.hidden) { if (e.key === 'Escape') closeModal(); return; }
